<style>

<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);

/* ===== SplitCore: pure calculation logic, no DOM, no storage. =====
   The same logic is reused unchanged by the Android build (Capacitor wraps this page). Money is in paise. */
const Core={
 inr:p=>'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2}),
 nm:(t,id)=>(t.members.find(m=>m.id===id)||{name:'Removed'}).name,
 // Typed amount -> whole paise, read from the text itself (no floating point). Accepts 250, 250.5, 1,250.75.
 // Returns null for anything else: letters, 3+ decimals, zero, negative, or above ₹1,00,00,000.
 toPaise(s){
  const m=/^(\d{1,8})(?:\.(\d{1,2}))?$/.exec(String(s||'').replace(/[,\s₹]/g,''));
  if(!m)return null;
  const p=+m[1]*100+(m[2]?+m[2].padEnd(2,'0'):0);
  return p>0&&p<=1e9?p:null;
 },
 // Split `amount` paise among n people in whole paise. The parts always add up exactly to `amount`.
 // Leftover paise go to a rotating set of people (seeded by the expense) so nobody is always the one who pays extra.
 split(amount,n,seed){
  const b=Math.floor(amount/n),r=amount-b*n;
  return Array.from({length:n},(_,k)=>b+(((k-seed)%n+n)%n<r?1:0));
 },
 // Build share map for an expense: {memberId: paise}
 sharesOf(e){
  const type=e.splitType||'equal';
  if(type==='exact'&&e.shares){
   const o={};
   for(const id in e.shares){const v=+e.shares[id];if(v>0)o[id]=v;}
   return o;
  }
  if(type==='percent'&&e.shares){
   // shares are in basis points (10000 = 100%)
   const bp=e.shares, ids=Object.keys(bp).filter(id=>bp[id]>0);
   if(!ids.length)return {};
   const o={};let s=0;
   ids.forEach(id=>{o[id]=Math.floor(e.amount*bp[id]/10000);s+=o[id];});
   let r=e.amount-s;
   for(let i=0;r>0;i=(i+1)%ids.length){o[ids[i]]++;r--;}
   return o;
  }
  // equal (default)
  const ids=(e.sharers||[]).filter(Boolean);
  if(!ids.length)return {};
  const parts=this.split(e.amount,ids.length,[...String(e.id||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%ids.length);
  const o={};ids.forEach((id,k)=>o[id]=parts[k]);
  return o;
 },
 compute(t){
  const net={},paid={},owe={};let total=0;
  t.members.forEach(m=>{net[m.id]=0;paid[m.id]=0;owe[m.id]=0});
  t.expenses.forEach(e=>{
   if(!(e.payer in net))return;
   const shareMap=this.sharesOf(e);
   const ids=Object.keys(shareMap).filter(i=>i in net);
   if(!ids.length)return;
   total+=e.amount;
   ids.forEach(i=>{const p=shareMap[i];owe[i]+=p;net[i]-=p;});
   paid[e.payer]+=e.amount;net[e.payer]+=e.amount;
  });
  // Payments already made between people reduce what is still owed.
  (t.payments||[]).forEach(p=>{if(p.from in net&&p.to in net){net[p.from]+=p.amt;net[p.to]-=p.amt}});
  const cr=[],db=[],tx=[];
  Object.keys(net).forEach(i=>{net[i]>0?cr.push({i,v:net[i]}):net[i]<0&&db.push({i,v:-net[i]})});
  while(cr.length&&db.length){ // biggest debtor pays biggest creditor: keeps the number of payments low
   cr.sort((a,b)=>b.v-a.v||(a.i<b.i?-1:1));db.sort((a,b)=>b.v-a.v||(a.i<b.i?-1:1));
   const c=cr[0],d=db[0],x=Math.min(c.v,d.v);
   tx.push({from:d.i,to:c.i,amt:x});c.v-=x;d.v-=x;
   if(!c.v)cr.shift();if(!d.v)db.shift();
  }
  const sumOwe=Object.values(owe).reduce((a,b)=>a+b,0);
  return{net,paid,owe,total,tx,sumOwe};
 },
 status(t){const c=this.compute(t);return !t.expenses.length?'empty':c.tx.length?'pending':'settled'},
 summary(t){
  const c=this.compute(t),f=this.inr,n=id=>this.nm(t,id),pays=t.payments||[];
  return `SplitShare – ${t.name}\n\nParticipants: ${t.members.map(m=>m.name).join(', ')}\nTotal Expense: ${f(c.total)}\n\n`
  +t.members.filter(m=>c.paid[m.id]).map(m=>`${m.name} paid: ${f(c.paid[m.id])}`).join('\n')
  +`\n\nEach person's share:\n`+t.members.map(m=>`${m.name}: ${f(c.owe[m.id])}`).join('\n')
  +`\n\nFinal Settlement:\n`+(c.tx.length?c.tx.map(x=>`${n(x.from)} pays ${n(x.to)} ${f(x.amt)}`).join('\n'):'All settled up 🎉')
  +(pays.length?`\n\nAlready settled:\n`+pays.map(q=>`${n(q.from)} paid ${n(q.to)} ${f(q.amt)}`).join('\n'):'');
 }
};

/* ===== Data layer: one interface, swappable backend. =====
   LocalDB below is a DEMO backend (data stays in this browser). For production, replace it with a Supabase
   implementation of the same 7 methods (auth.signUp/signInWithPassword/resetPasswordForEmail, and trips
   tables). Schema + row-level security is in supabase-schema.sql. Only the public anon key goes in the app. */
// Mobile numbers: keep digits only, drop +91 / leading 0, so 9876543210, +91 98765 43210 and 09876543210 are the same number.
const normMob=m=>{let d=String(m||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('91'))d=d.slice(2);else if(d.length===11&&d[0]==='0')d=d.slice(1);return d};
const LocalDB=(()=>{
 const R=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
 const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
 const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
 const hash=async(pw,salt)=>{
  if(!window.crypto||!crypto.subtle)throw Error('Secure browser context needed. Open via https or localhost.');
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',iterations:150000,salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0))},k,256));
 };
 const pub=u=>u&&{id:u.id,first:u.first,last:u.last,mobile:u.mobile,email:u.email};
 const users=()=>R('ss_users',[]),me=()=>R('ss_sess',null);
 const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
 return{
  async register(p){
   const mob=normMob(p.mobile),us=users();if(us.some(u=>normMob(u.mobile)===mob))throw Error('An account with this mobile number already exists.');
   const salt=newSalt(),u={id:uid(),first:p.first,last:p.last,mobile:mob,email:(p.email||'').toLowerCase(),salt,hash:await hash(p.password,salt)};
   us.push(u);W('ss_users',us);W('ss_sess',u.id);return pub(u);
  },
  async login(mobile,pw){
   const mob=normMob(mobile),u=mob&&users().find(x=>normMob(x.mobile)===mob);
   if(!u||u.hash!==await hash(pw,u.salt))throw Error('Mobile number or password is incorrect.');
   W('ss_sess',u.id);return pub(u);
  },
  async resetPassword(mobile,first,pw){ // demo only. Production: OTP sent to the mobile number.
   const mob=normMob(mobile),us=users(),u=mob&&us.find(x=>normMob(x.mobile)===mob&&x.first.trim().toLowerCase()===first.trim().toLowerCase());
   if(!u)throw Error('No account matches that mobile number and first name.');
   u.salt=newSalt();u.hash=await hash(pw,u.salt);W('ss_users',us);
  },
  async session(){return pub(users().find(u=>u.id===me()))},
  async logout(){localStorage.removeItem('ss_sess')},
  async updateProfile(p){
   const us=users(),u=us.find(x=>x.id===me());if(!u)throw Error('Please log in again.');
   const mob=normMob(p.mobile),em=(p.email||'').toLowerCase();
   if(us.some(x=>x.id!==u.id&&normMob(x.mobile)===mob))throw Error('That mobile number is used by another account.');
   Object.assign(u,{first:p.first,last:p.last,mobile:mob,email:em});W('ss_users',us);return pub(u);
  },
  async listTrips(){const o=me();return R('ss_trips',[]).filter(t=>t.owner===o).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))},
  async saveTrip(t){
   const o=me();if(!o||t.owner!==o)throw Error('Not allowed.'); // a user can only write their own trips
   const all=R('ss_trips',[]),i=all.findIndex(x=>x.id===t.id);
   if(i>=0){if(all[i].owner!==o)throw Error('Not allowed.');all[i]=t}else all.push(t);W('ss_trips',all);
  },
  async deleteTrip(id){const o=me();W('ss_trips',R('ss_trips',[]).filter(t=>!(t.id===id&&t.owner===o)))}
 };
})();
const DB=LocalDB;

/* ===== UI ===== */
const S={user:null,guest:false,view:'auth',tab:'login',trips:[],cur:null,edit:false};
/* ===== Google Drive backup (each user's own Drive, hidden app-data folder) =====
   The backup file is stored in the user's OWN Google Drive. The developer cannot see it. Only the Drive 'appdata' permission is used. */
const GOOGLE_CLIENT_ID='446236439899-uer3q3vvlkbgk80f1vfl5ao9n83u5tk6.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata',BK_FILE='splitshare-backup.json';
let gsiP=null,gTok=null,gExp=0,busy=false;
const loadGsi=()=>gsiP||(gsiP=new Promise((res,rej)=>{
 const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
 s.onload=()=>res();s.onerror=()=>rej(Error('Could not load Google sign-in. Check your internet connection.'));document.head.appendChild(s);
}).catch(e=>{gsiP=null;throw e}));
const bkAcct=()=>{let v='';try{v=localStorage.getItem('ss_bkacct_'+(S.user&&S.user.id))||''}catch(e){}return v||(S.user&&S.user.email)||''};
async function linkBkAcct(tok){ // remember which Google account holds the backup; fill the profile email if it was empty
 try{
  const j=await(await dFetch(tok,'https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();
  const em=((j.user&&j.user.emailAddress)||'').toLowerCase();if(!em)return;
  try{localStorage.setItem('ss_bkacct_'+S.user.id,em)}catch(e){}
  if(!S.user.email){S.user=await DB.updateProfile({first:S.user.first,last:S.user.last,mobile:S.user.mobile,email:em});toast('Backup email '+em+' added to your account')}
 }catch(e){}
}
async function driveToken(){
 if(gTok&&Date.now()<gExp)return gTok;
 await loadGsi(); // already preloaded when the Profile screen opens, so the tap still counts as a user gesture
 return new Promise((res,rej)=>{
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,
   callback:r=>{
    if(r.error)return rej(Error(r.error==='access_denied'?'Google Drive permission was not given.':'Google sign-in failed ('+r.error+').'));
    gTok=r.access_token;gExp=Date.now()+Math.max(60,(+r.expires_in||3600)-60)*1000;res(gTok)},
   error_callback:e=>rej(Error(e&&e.type==='popup_closed'?'Google sign-in was cancelled.':'Google sign-in could not open ('+((e&&e.type)||'error')+').'))});
  const h=bkAcct();c.requestAccessToken(h?{login_hint:h,hint:h}:{});
 });
}
async function dFetch(tok,url,opt={}){
 const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
 if(r.status===401){gTok=null;throw Error('Google session expired. Please try again.')}
 if(r.status===403)throw Error('Google Drive refused access. Tick the Drive permission when signing in.');
 if(!r.ok)throw Error('Google Drive error ('+r.status+').');
 return r;
}
async function findBackup(tok){
 const q=encodeURIComponent(`name='${BK_FILE}' and 'appDataFolder' in parents and trashed=false`);
 const j=await(await dFetch(tok,`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc`)).json();
 return (j.files||[])[0]||null;
}
async function putBackup(tok,data,existing){
 const b='ssb'+uid(),meta=existing?{name:BK_FILE}:{name:BK_FILE,parents:['appDataFolder']};
 const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(data)}\r\n--${b}--`;
 const url=existing?`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
 await dFetch(tok,url,{method:existing?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
}
// Accept only well-formed trips from a backup file; anything else is skipped.
function cleanTrip(r,owner){
 const okId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(v); // ids end up in HTML attributes, so only plain ids are accepted
 if(!r||typeof r!=='object'||!okId(r.id)||!Array.isArray(r.members)||!Array.isArray(r.expenses))return null;
 const str=(v,n)=>String(v??'').slice(0,n);
 const members=r.members.filter(m=>m&&okId(m.id)&&typeof m.name==='string').map(m=>({id:m.id,name:str(m.name,30),...(m.self?{self:true}:{})}));
 const expenses=r.expenses.filter(e=>e&&okId(e.id)&&Number.isFinite(e.amount)&&e.amount>0&&okId(e.payer)&&Array.isArray(e.sharers)&&e.sharers.every(okId))
  .map(e=>({...e,desc:str(e.desc,60),date:str(e.date,20)}));

/* ===== Back button support =====
   Every screen change adds a browser-history entry, so Android's Back button returns to the previous screen.
   History always starts with a 'root' entry: pressing Back there shows "Press back again to exit". */
const snap=i=>({v:S.view,tab:S.tab,t:S.view==='trip'&&S.cur?S.cur.id:null,i:i??((history.state&&history.state.i)||1)});
function nav(mode){
 const cur=history.state||{i:1};
 if(mode==='push'){
  const s=snap(cur.i+1);
  if(cur.v===s.v&&cur.tab===s.tab&&cur.t===s.t)history.replaceState(snap(cur.i),'');else history.pushState(s,'');
 }else history.replaceState(snap(cur.i),'');
}
const resetStack=()=>{const i=(history.state&&history.state.i)||1;if(i>1)history.go(1-i)}; // jump back to the first screen entry
let lastRoot=0;
addEventListener('popstate',e=>{
 const dlg=$('#dlg');
 if(dlg.open){dlg.close();return} // Back closes an open pop-up first
 const st=e.state;if(!st)return;
 if(S.view==='trip'&&hasDraftData(S.cur)&&!(st.v==='trip'&&S.cur&&S.cur.id===st.t)&&!confirm(LEAVE_MSG)){history.pushState(snap((st.i||1)+1),'');return}
 if(st.root){
  if(Date.now()-lastRoot<2000){lastRoot=0;history.back();return} // second Back: leave the app
  lastRoot=Date.now();toast('Press back again to exit');history.pushState(snap(1),'');return;
 }
 const loggedIn=S.user||S.guest;
 if((loggedIn&&st.v==='auth')||(!loggedIn&&st.v!=='auth')){history.replaceState(snap(st.i),'');return} // stale entry from before login/logout
 if(st.v===S.view&&st.tab===S.tab&&(st.v!=='trip'||(S.cur&&S.cur.id===st.t)))return;
 S.view=st.v;S.tab=st.tab||S.tab;S.edit=false;
 if(st.v==='trip'&&!S.guest){
  S.cur=S.trips.find(x=>x.id===st.t)||null;
  if(!S.cur){S.view='trips';history.replaceState(snap(st.i),'')} // that trip was deleted
 }
 render();scrollTo(0,0);
});

 const t=S.cur,u=S.user||{};
 $('#dlg').innerHTML=`<div class="dh"><b>Share summary</b><button data-a="closeDlg" aria-label="Close">×</button></div><pre>${esc(Core.summary(t))}</pre>
  <label>WhatsApp number (optional, leave empty to pick a chat)</label><input id="shPh" type="tel" value="${esc(u.mobile||'')}">
  <label>Email to (optional)</label><input id="shEm" type="email" value="${esc(u.email||'')}">
  <div class="btns"><button class="btn" data-a="shWa">WhatsApp</button><button class="btn" data-a="shMail">Email</button><button class="btn o" data-a="shCopy">Copy summary</button></div>
  <p class="muted" style="margin:10px 0 0;font-size:.85rem">Nothing is sent until you confirm in WhatsApp or your email app.</p>`;
 history.pushState({...snap((history.state&&history.state.i||1)+1),dlg:1},'');
 $('#dlg').showModal();
}
$('#dlg').addEventListener('close',()=>{if(history.state&&history.state.dlg)history.back()});
async function copy(text){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}
 const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok;
}


document.addEventListener('change',e=>{
  const t=e.target;
  if(t && t.name==='splitType'){
    const type=t.value;
    const equalBox=$('#equalBox'), customBox=$('#customBox'), customLabel=$('#customLabel'), customHint=$('#customHint');
    if(!equalBox||!customBox)return;
    if(type==='equal'){
      equalBox.style.display='';
      customBox.style.display='none';
    }else{
      equalBox.style.display='none';
      customBox.style.display='';
      if(type==='exact'){
        if(customLabel)customLabel.textContent='Enter exact amount (₹) for each person';
        if(customHint)customHint.textContent='Amounts must add up exactly to the total.';
        document.querySelectorAll('.shareInp').forEach(i=>{i.placeholder='0.00';i.inputMode='decimal';});
      }else{
        if(customLabel)customLabel.textContent='Enter percentage (%) for each person';
        if(customHint)customHint.textContent='Percentages must add up to 100%.';
        document.querySelectorAll('.shareInp').forEach(i=>{i.placeholder='%';i.inputMode='decimal';});
      }
    }
  }
});

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a]');
 if(e.target===$('#dlg')){$('#dlg').close();return}
 if(!el)return;
 const a=el.dataset.a,id=el.dataset.id,t=S.cur;
 const leaving=(a==='go'&&id!=='trip')||a==='open'||a==='newTrip'||a==='logout'||(a==='add'&&S.view!=='trip');
 if(leaving&&S.view==='trip'&&hasDraftData(t)&&!confirm(LEAVE_MSG))return;
 try{switch(a){
  case 'tab':
   if(S.tab==='forgot'&&id==='login'&&history.state&&history.state.tab==='forgot'){history.back();break}
   S.tab=id;nav(id==='forgot'?'push':'replace');render();break;
  case 'guest':{S.guest=true;S.user=null;S.cur=newTrip(null);sessionStorage.setItem('ss_guest',JSON.stringify(S.cur));S.view='trip';nav('replace');render();break}
  case 'exitGuest':sessionStorage.removeItem('ss_guest');Object.assign(S,{guest:false,cur:null,view:'auth',tab:'login'});nav('replace');render();break;
  case 'toReg':sessionStorage.removeItem('ss_guest');Object.assign(S,{guest:false,cur:null,view:'auth',tab:'register'});nav('replace');render();break;
  case 'go':S.view=id;S.edit=false;nav('push');render();scrollTo(0,0);break;
  case 'newTrip':{const n=newTrip(S.user.id);S.cur=n;await commit(n,false);S.view='trip';nav('push');render();scrollTo(0,0);break}
  case 'add':
   if(S.view==='trip'){const f=$('#expForm');f.scrollIntoView({behavior:'smooth',block:'center'});$('#desc').focus()}
   else if(S.guest){S.view='trip';nav('push');render()}
   else{const n=newTrip(S.user.id);S.cur=n;await commit(n,false);S.view='trip';nav('push');render();scrollTo(0,0)}break;
  case 'open':S.cur=S.trips.find(x=>x.id===id);if(ensureSelf(S.cur))await commit(S.cur,false);S.view='trip';nav('push');render();scrollTo(0,0);break;
  case 'rmMem':
   if(t.expenses.some(x=>x.payer===id||x.sharers.includes(id))||t.payments.some(p=>p.from===id||p.to===id)){toast("Delete this person's expenses and payments first");break}
   t.members=t.members.filter(m=>m.id!==id);await commit(t);break;
  case 'delExp':t.expenses=t.expenses.filter(x=>x.id!==id);await commit(t);toast('Expense deleted');break;
  case 'selAll':case 'selNone':document.querySelectorAll('#expForm input[name=sh]').forEach(i=>i.checked=a==='selAll');break;
  case 'settle':{
   const tr=findTrip(el.dataset.t),{f,to,m}=el.dataset;if(!tr)break;
   if(!Core.compute(tr).tx.some(x=>x.from===f&&x.to===to&&x.amt===+m))break; // ignore double taps / stale buttons
   tr.payments.push({id:uid(),from:f,to,amt:+m,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})});
   await commit(tr);toast('Payment recorded');break}
  case 'undo':{
   const tr=findTrip(el.dataset.t);if(!tr)break;
   tr.payments=tr.payments.filter(p=>p.id!==id);await commit(tr);toast('Payment removed');break}
  case 'saveTrip':{
   if(!t||!t.draft)break;
   const tn=$('#tname');if(tn&&tn.value.trim())t.name=tn.value.trim();
   if(unnamed(t)){toast('Give your trip a name first');if(tn)tn.focus();break}
   if(t.members.length<2&&!t.expenses.length){toast('Add at least one person or an expense first');break}
   delete t.draft;await DB.saveTrip(t);if(!S.trips.some(x=>x.id===t.id))S.trips.unshift(t);render();toast('Trip saved');break}
  case 'delTrip':
   if(!confirm(S.guest?'Clear this temporary trip?':'Delete this trip permanently?'))break;
   if(S.guest){S.cur=newTrip(null);await commit(S.cur)}
   else{await DB.deleteTrip(t.id);S.trips=S.trips.filter(x=>x.id!==t.id);S.cur=null;history.back()}break; // Back lands on the previous screen and redraws it
  case 'share':openShare();break;
  case 'closeDlg':$('#dlg').close();break;
  case 'shCopy':toast(await copy(Core.summary(t))?'Summary copied':'Copy failed. Select the text and copy it.');break;
  case 'shWa':{let n=$('#shPh').value.replace(/\D/g,'');if(n.length===10)n='91'+n;
   window.open(`https://wa.me/${n}?text=${encodeURIComponent(Core.summary(t))}`,'_blank','noopener');break}
  case 'shMail':location.href=`mailto:${encodeURIComponent($('#shEm').value.trim())}?subject=${encodeURIComponent('SplitShare – '+t.name)}&body=${encodeURIComponent(Core.summary(t))}`;break;
  case 'pickContacts':{
   if(!('contacts' in navigator&&'ContactsManager' in window)){toast("Contact picker isn't available on this phone. Type the name instead.");break}
   let picked;try{picked=await navigator.contacts.select(['name'],{multiple:true})}catch(x){if(x&&x.name!=='AbortError')toast("Couldn't open contacts. Type the name instead.");break}
   let added=0;
   for(const c of picked||[]){
    const n=String((c.name||[])[0]||'').trim().slice(0,30);
    if(n&&!t.members.some(m=>m.name.toLowerCase()===n.toLowerCase())){t.members.push({id:uid(),name:n});added++}
   }
   if(added){await commit(t);toast(added+(added>1?' people added':' person added'))}else if(picked&&picked.length)toast('Already added, or the contact has no name');
   break}
  case 'bkUp':{
   if(busy)break;busy=true;
   try{
    const tok=await driveToken();await linkBkAcct(tok);toast('Saving backup…');
    const data={app:'SplitShare',v:1,savedAt:new Date().toISOString(),profile:{first:S.user.first,last:S.user.last,mobile:S.user.mobile,email:S.user.email||''},trips:S.trips};
    await putBackup(tok,data,await findBackup(tok));
    try{localStorage.setItem('ss_lastbk_'+S.user.id,new Date().toISOString())}catch(e){}
    if(S.view==='profile')render();toast('Backup saved to your Google Drive');
   }finally{busy=false}
   break}
  case 'bkRestore':{
   if(busy)break;busy=true;
   try{
    const tok=await driveToken();await linkBkAcct(tok);toast('Looking for your backup…');
    const f=await findBackup(tok);
    if(!f){toast('No SplitShare backup found in this Google account');break}
    const d=await(await dFetch(tok,`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json();
    if(!d||d.app!=='SplitShare'||!Array.isArray(d.trips)){toast('That backup file is not valid');break}
    const sc=x=>x.members.length+x.expenses.length+x.payments.length;
    let add=0,upd=0;
    for(const raw of d.trips){
     const tr=cleanTrip(raw,S.user.id);if(!tr)continue;
     const cur=S.trips.find(x=>x.id===tr.id);
     if(cur&&sc(cur)>=sc(tr))continue; // keep the phone's version when it is the same or newer
     try{await DB.saveTrip(tr)}catch(e){continue}
     cur?upd++:add++;
    }
    S.trips=(await loadTrips());
    if(S.view==='profile')render();
    toast(add||upd?`Restored: ${add} new, ${upd} updated`:'Nothing to restore. This phone is already up to date');
   }finally{busy=false}
   break}
  case 'editP':S.edit=!S.edit;render();break;
  case 'logout':await DB.logout();Object.assign(S,{user:null,guest:false,view:'auth',tab:'login',trips:[],cur:null,edit:false});nav('replace');resetStack();render();break;
 }}catch(x){toast(x.message)}
});

document.addEventListener('change',async e=>{
 const t=S.cur;if(!t||S.view!=='trip')return;
 if(e.target.id==='tname'){t.name=e.target.value.trim()||'Untitled trip';await commit(t,false)}
 if(e.target.id==='tdate'&&e.target.value){t.date=e.target.value;await commit(t,false)}
});

const okMob=m=>/^[6-9]\d{9}$/.test(normMob(m)),okMail=m=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);
document.addEventListener('submit',async e=>{
 e.preventDefault();
 const f=e.target,id=f.id,v=Object.fromEntries(new FormData(f)),t=S.cur,err=f.querySelector('.err'),fail=m=>{if(err)err.textContent=m};
 try{
  if(id==='fLogin'){
   if(!normMob(v.mobile))return fail('Enter your mobile number.');
   S.user=await DB.login(v.mobile,v.password);await enter()}
  else if(id==='fReg'){
   v.mobile=normMob(v.mobile);v.email=(v.email||'').trim();
   if(!v.first.trim()||!v.last.trim())return fail('Enter your first and last name.');
   if(!okMob(v.mobile))return fail('Enter a valid 10-digit mobile number.');
   if(v.email&&!okMail(v.email))return fail('Enter a valid email address, or leave it empty.');
   if(v.password.length<8)return fail('Password must be at least 8 characters.');
   if(v.password!==v.confirm)return fail('Passwords do not match.');
   S.user=await DB.register({first:v.first.trim(),last:v.last.trim(),mobile:v.mobile,email:v.email,password:v.password});await enter();toast('Account created');
  }
  else if(id==='fForgot'){
   if(v.password.length<8)return fail('Password must be at least 8 characters.');
   await DB.resetPassword(v.mobile,v.first,v.password);toast('Password updated. Please log in.');
   if(history.state&&history.state.tab==='forgot')history.back();else{S.tab='login';nav('replace');render()}
  }
  else if(id==='fProf'){
   v.mobile=normMob(v.mobile);v.email=(v.email||'').trim();
   if(!okMob(v.mobile))return fail('Enter a valid 10-digit mobile number.');if(v.email&&!okMail(v.email))return fail('Enter a valid email address, or leave it empty.');
   S.user=await DB.updateProfile({first:v.first.trim(),last:v.last.trim(),mobile:v.mobile,email:v.email});S.edit=false;render();toast('Profile updated');
  }
  else if(id==='fMem'){
   const n=v.n.trim(),m=$('#mErr');if(!n){m.textContent='Enter a name.';return}
   if(t.members.some(x=>x.name.toLowerCase()===n.toLowerCase())){m.textContent='That name is already added.';return}
   t.members.push({id:uid(),name:n});await commit(t);$('#fMem input').focus();
  }
  else if(id==='expForm'){
   const e2=$('#eErr'),desc=v.desc.trim(),amt=Core.toPaise(v.amount);
   const splitType=(f.querySelector('input[name=splitType]:checked')||{}).value||'equal';
   if(t.members.length<2){e2.textContent='Add at least two people first.';return}
   if(!desc){e2.textContent='Add a short description.';return}
   if(!amt){e2.textContent='Enter an amount from ₹0.01 to ₹1,00,00,000, with up to 2 decimals.';return}
   if(unnamed(t)){e2.textContent='Give your trip a name first (at the top of the page).';const tn=$('#tname');if(tn){tn.focus();tn.scrollIntoView&&tn.scrollIntoView({behavior:'smooth',block:'center'})}return}
   let exp={id:uid(),desc,amount:amt,payer:v.payer,splitType,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
   try{
    if(splitType==='equal'){
      const sh=[...f.querySelectorAll('input[name=sh]:checked')].map(i=>i.value);
      if(!sh.length){e2.textContent='Pick at least one person who shared it.';return}
      exp.sharers=sh;
    }else if(splitType==='exact'){
      const shares={};let sum=0;
      f.querySelectorAll('.shareInp').forEach(inp=>{
        const val=inp.value.trim();
        if(!val)return;
        const p=Core.toPaise(val);
        if(p===null){e2.textContent='Check the amount for each person.';throw 1;}
        if(p>0){shares[inp.dataset.mid]=p;sum+=p;}
      });
      if(!Object.keys(shares).length){e2.textContent='Enter amounts for at least one person.';return}
      if(sum!==amt){e2.textContent=`Shares add up to ${Core.inr(sum)}, but total is ${Core.inr(amt)}.`;return}
      exp.shares=shares;exp.sharers=Object.keys(shares);
    }else if(splitType==='percent'){
      const shares={};let sum=0;
      f.querySelectorAll('.shareInp').forEach(inp=>{
        const val=inp.value.trim();
        if(!val)return;
        if(!/^\d{1,3}(\.\d{1,2})?$/.test(val)){e2.textContent='Enter valid percentages (e.g. 25 or 33.33).';throw 1;}
        const bp=Math.round(parseFloat(val)*100);
        if(bp>0){shares[inp.dataset.mid]=bp;sum+=bp;}
      });
      if(!Object.keys(shares).length){e2.textContent='Enter percentages for at least one person.';return}
      if(sum!==10000){e2.textContent=`Percentages add up to ${(sum/100).toFixed(2)}%, not 100%.`;return}
      exp.shares=shares;exp.sharers=Object.keys(shares);
    }
   }catch(x){if(x===1)return;throw x;}
   t.expenses.push(exp);
   $('#desc').value='';$('#amount').value='';
   f.querySelectorAll('input[name=sh]').forEach(i=>i.checked=true);
   f.querySelectorAll('.shareInp').forEach(i=>i.value='');
   const eqRadio=f.querySelector('input[name=splitType][value=equal]');
   if(eqRadio)eqRadio.checked=true;
   const equalBox=$('#equalBox'),customBox=$('#customBox');
   if(equalBox)equalBox.style.display='';
   if(customBox)customBox.style.display='none';
   await commit(t);toast('Expense added');
  }
 }catch(x){fail(x.message);if(!err)toast(x.message)}
});

(async()=>{
 try{
  const u=await DB.session();
  if(u){S.user=u;S.trips=(await loadTrips());S.view='home'}
  else{const g=sessionStorage.getItem('ss_guest');if(g){S.guest=true;S.cur=norm(JSON.parse(g));S.view='trip'}}
 }catch(e){}
 history.replaceState({root:1,i:0},'');history.pushState(snap(1),''); // root entry + first screen
 render();
})();
})();
</script>
